name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: HeyYouKit tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          swift --version
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: HeyYouKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('HeyYouKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build
        working-directory: HeyYouKit
        run: swift build
      # GitHub's macOS runners ship Xcode 26, which doesn't compile the
      # String Catalog (Localizable.xcstrings) under SwiftPM. Skip the tests
      # that read localized strings until Xcode 27 is available on runners;
      # run them locally with ./scripts/test.sh.
      - name: Test
        working-directory: HeyYouKit
        run: swift test --skip 'spanish|singularCalendar'
